[package]
name = "alien-agent-view"
version = "0.1.0"
edition = "2021"

[lib]
name = "alien_agent_view_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
dirs = "6"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"
portable-pty = "0.9"
